# ────────────────────────────────────────────────────────────
#  EhViewer-Nya — iOS 构建 & 发布流水线
#  触发: 打版本 tag (v*) / 手动 dispatch
#  产物: 未签名 IPA 附到 GitHub Release（手动 dispatch 时仅存为 artifact）
#
#  本项目没有付费 Apple 开发者账号，所以不做任何签名与公证：
#  归档时关闭代码签名，再把 .xcarchive 里的 .app 自行打包成 IPA。
#  用户拿到后用 Sideloadly / AltStore / SideStore 以自己的 Apple ID 重签安装。
#  因此这条流水线不需要任何签名 secret。
# ────────────────────────────────────────────────────────────

name: Build & Release iOS

# 这是发布流水线，不是持续集成——每次 push 都出一个包既无必要，
# 失败时还会按 push 频率发失败邮件。日常校验交给 build.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_note:
        description: "本次构建备注 (会追加到版本标题)"
        required: false
        default: ""

# 同一分支只保留最新一次构建
concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: true

# 建 Release 与回写 source.json 都需要写权限
permissions:
  contents: write

env:
  SCHEME: "ehviewer nya"
  PROJECT: "ehviewer nya.xcodeproj"
  APP_NAME: "ehviewer nya"
  ARCHIVE_PATH: build/EhViewer-Nya.xcarchive
  IPA_DIR: build/ipa

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # ─── 0. 检出代码 ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── 1. 环境准备: Xcode 版本 ──────────────────────────
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      # ─── 2. 解析 SPM 依赖 ──────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm_cache"

      # ─── 3. 归档（不签名）───────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO 让归档阶段完全跳过签名，于是既不需要证书、
      # 也不需要描述文件，runner 上不需要任何凭据。这三个变量与 build.yml 一致。
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm_cache" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "✅ Archive complete"
          ls -la "$ARCHIVE_PATH/Products/Applications"

      # ─── 4. 读取版本信息 ────────────────────────────────────
      # 放在打包之前，IPA 才能用版本号命名。
      - name: Extract version info
        id: version
        run: |
          PLIST_PATH="$ARCHIVE_PATH/Products/Applications/$APP_NAME.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            echo "::error::归档里找不到主 App 的 Info.plist: $PLIST_PATH"
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH")
          BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH")
          DATE=$(date +%Y%m%d)
          TITLE="EhViewer-Nya v${VERSION} (${BUILD_NUM}) - ${DATE}"
          if [ -n "${{ github.event.inputs.build_note }}" ]; then
            TITLE="${TITLE} - ${{ github.event.inputs.build_note }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "📦 $TITLE"

      # ─── 5. 打包成 IPA ──────────────────────────────────────
      # 不走 xcodebuild -exportArchive：那一步要求有效的签名身份与描述文件，
      # 正是本项目没有的东西。IPA 的结构本身只是「Payload/<App>.app 的 zip」，
      # 所以直接从归档里取 .app 自己压一个。
      # -y 必须加：内嵌 framework 内部靠符号链接组织，丢了会破坏 bundle 结构。
      - name: Package unsigned IPA
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::归档里找不到 .app: $APP_PATH"
            exit 1
          fi

          IPA_NAME="EhViewer-Nya-${{ steps.version.outputs.version }}.ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          ( cd "$IPA_DIR" && zip -qry "$IPA_NAME" Payload )
          rm -rf "$IPA_DIR/Payload"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          echo "✅ IPA packaged"
          ls -lh "$IPA_DIR/$IPA_NAME"
          unzip -l "$IPA_DIR/$IPA_NAME" | head -6

      # ─── 6. 留存产物 ────────────────────────────────────────
      # 手动 dispatch 没有 tag，不会建 Release，靠 artifact 取包。
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EhViewer-Nya-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: build/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      # ─── 7. 发布到 GitHub Release ───────────────────────────
      # 只在 tag 触发时发布；重新运行时覆盖同名 Release。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          IPA="$IPA_DIR/$IPA_NAME"

          # 说明写死而不用 --generate-notes：AltStore 源清单里的更新说明取自
          # Release 正文（截断 2000 字），对订阅者来说「这个包未签名、怎么装」
          # 比提交列表有用得多。逐版本改动看 CHANGELOG。
          cat > build/release-notes.md << 'EOF'
          > ⚠️ **这个 IPA 未签名。** 本项目没有付费 Apple 开发者账号，无法提供签名与公证。
          >
          > 请用你自己的 Apple ID 通过 [Sideloadly](https://sideloadly.io) /
          > [AltStore](https://altstore.io) / [SideStore](https://sidestore.io) 重签后安装。
          > 免费账号签出的 App 7 天后失效，重签即可，数据不会丢。
          >
          > 也可以把本仓库的 `source.json` 添加为 AltStore 源，之后在设备上自助更新。

          安装步骤见 [README](https://github.com/ShiroiTree/EhViewer-Nya/blob/main/README.md)，
          逐版本改动见 [CHANGELOG](https://github.com/ShiroiTree/EhViewer-Nya/blob/main/CHANGELOG.md)。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖其中的 IPA"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "${{ steps.version.outputs.title }}" \
              --notes-file build/release-notes.md
          fi

          echo "✅ 已发布: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      # ─── 8. 刷新 AltStore / SideStore 源清单 ────────────────
      # iOS 不允许下载执行原生代码，所以没有热更新。「装一次之后自动更新」
      # 靠的是 AltStore / SideStore 的源订阅：用户添加一次源，之后新版本
      # 会出现在它们的更新列表里，用用户自己的证书重签安装。
      # 必须排在发布之后——清单里的 downloadURL 指向 Release 资产。
      - name: Refresh AltStore source manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/build_altstore_source.py
          if git diff --quiet source.json; then
            echo "清单无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source.json
            git commit -m "chore: 刷新 AltStore 源清单"
            git push origin HEAD:main
          fi

      # ─── 9. 构建摘要 ────────────────────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "  ✅ 构建完成（IPA 未签名）"
          echo "──────────────────────────────────────────────"
          echo "  版本: ${{ steps.version.outputs.title }}"
          echo "  提交: ${{ github.sha }}"
          echo ""
          echo "  📦 Release:"
          echo "  ${{ github.server_url }}/${{ github.repository }}/releases"
          echo "══════════════════════════════════════════════"

          RELEASE_LINE='手动 dispatch 构建，未建 Release，请从本页 artifact 下载。'
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_LINE="[${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 📱 EhViewer-Nya iOS 构建成功

          | 项目 | 值 |
          |------|-----|
          | **版本** | ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) |
          | **日期** | ${{ steps.version.outputs.date }} |
          | **提交** | \`${{ github.sha }}\` |
          | **Release** | ${RELEASE_LINE} |

          ### 产物说明

          这个 IPA **未签名**（本项目没有付费 Apple 开发者账号）。用户需用
          Sideloadly / AltStore / SideStore 以自己的 Apple ID 重签后安装，
          或订阅本仓库的 \`source.json\` 自助更新。
          EOF
